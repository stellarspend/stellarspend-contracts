[package]
name = "zk-verifier"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
# Pin ed25519-dalek to 2.x — soroban-env-host declares >=2.0.0
# without an upper bound, letting the resolver select incompatible 3.x.
ed25519-dalek = "=2.2.0"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Pin ed25519-dalek to 2.x — soroban-env-host testutils declares >=2.0.0
# without an upper bound, letting the resolver select incompatible 3.x.
ed25519-dalek = "=2.2.0"
