[package]
name = "stellarspend-contracts-tests"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[dependencies]
# Pin ed25519-dalek to the 2.x line. soroban-env-host 22.1.3 declares
# `ed25519-dalek = ">=2.0.0"` (no upper bound), so without this pin the
# resolver selects the newer 3.x release whose `rand_core`/`TryRng` API is
# incompatible with the `rand_chacha 0.3`/`rand_core 0.6` used by the env-host
# testutils. This pin unifies the workspace on a compatible 2.x version.
ed25519-dalek = "2.2"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
savings = { path = "contracts/savings" }
savings-goals = { path = "contracts/savings-goals" }

[[test]]
name = "snapshot_tests"
path = "tests/snapshot_tests.rs"

[[test]]
name = "memo_tests"
path = "tests/memo_tests.rs"

[[test]]
name = "governance_test"
path = "contracts/tests/governance_test.rs"

[[test]]
name = "rate_limit_tests"
path = "tests/rate_limit_tests.rs"

[[test]]
name = "concurrent_spending_tests"
path = "contracts/tests/concurrent_spending_tests.rs"

[[test]]
name = "storage_key_audit"
path = "contracts/tests/storage_key_audit.rs"

[[test]]
name = "savings_goals_test"
path = "contracts/tests/savings_goals_test.rs"

[[test]]
name = "governance_tests"
path = "tests/governance_tests.rs"

[[test]]
name = "throttling_tests"
path = "tests/throttling_tests.rs"

[[test]]
name = "throttling_test"
path = "contracts/tests/throttling_test.rs"


[[test]]
name = "analytics_indexing_tests"
path = "tests/analytics_indexing_tests.rs"

[[test]]
name = "timelock_tests"
path = "tests/timelock_tests.rs"

[[test]]
name = "security_e2e_tests"
path = "tests/security_e2e_tests.rs"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/stellarspend/stellarspend-contracts"

[workspace.dependencies]
soroban-sdk = "=22.0.0"
shared = { path = "contracts/shared" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
