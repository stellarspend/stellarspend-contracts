name: Contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.93
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install OS packages for soroban-cli (hidapi, dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Soroban CLI
        run: cargo install soroban-cli --locked

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Generate Cargo.lock and pin ed25519-dalek
        run: |
          cargo generate-lockfile
          cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0 \
            || echo "ed25519-dalek 3.x not in lockfile; already compatible"

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build WASM release
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (dependency vulnerability scan)
        run: cargo audit
